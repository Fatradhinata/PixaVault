  <style>
    .mil-top-panel {
      position: fixed;
      width: 100%;
      background: transparent;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      gap: 90px;
    }

    .mil-logo img {
      max-width: 120px;
    }

    .mil-navigation nav {
      display: flex;
      gap: 45px;
    }

    .mil-navigation nav ul li {
      position: relative;
    }

    .mil-navigation nav ul li a {
      text-decoration: none;
      color: #ffffff;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 20px;
      transition: color 0.3s, background 0.3s;
      position: relative;
    }

    .mil-navigation nav ul li a:hover,
    .mil-navigation nav ul li a.active {
      color: #bcff00;
      /* Warna teks hover dan aktif */
    }

    .mil-navigation nav ul li a::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 50%;
      right: 50%;
      height: 2px;
      background-color: transparent;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    .mil-navigation nav ul li a:hover::after {
      left: 0;
      right: 0;
    }

    .mil-navigation nav ul li ul {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: #282c34;
      border-radius: 10px;
      padding: 10px;
      list-style: none;
      z-index: 2000;
    }

    .mil-navigation nav ul li:hover ul {
      display: block;
    }

    .mil-navigation nav ul li ul li a {
      padding: 8px 12px;
      color: #ffffff;
      display: block;
    }

    .mil-top-panel-right {
      display: flex;
      align-items: center;
      text-decoration: none;
      gap: 30px;

      &>* {
        cursor: pointer;
      }

      .mil-top-panel-user {
        position: relative;
      }
    }

    .mil-top-panel-buttons {

      background: rgb(188, 255, 0);
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: bold;
      transition: background 0.3s;

      &:hover {
        background-color: #CFFF00;
      }
    }

    .mil-top-panel-link {
      color: white;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;

      &:hover {
        color: rgb(188, 255, 0);
      }
    }

    .nav-horizontal-dot-wrapper {
      position: relative;
    }

    .mil-nav-dropdown {
      position: absolute;
      display: none;
      left: -120%;
      transform: translateY(15%);
      border: 1px solid #D9D9D9;
      border-radius: 8px;
      background-color: white;

      hr {
        margin: 0px -11px;
        border: none;
        border-top: 1px solid #D9D9D9;
        width: calc(100% + 22px);
      }

      .mil-nav-dropdown-logout {
        color: rgba(252, 120, 120, 0.64);

        &:hover {
          color: #FC7878;
        }
      }

      div {
        display: flex;
        flex-direction: column;
        padding: 11px;
        gap: 10px;

        button {
          text-align: left;
          outline: none;
          border: none;
          min-width: 145px;
          padding: 10px;
          border-radius: 8px;
          background-color: transparent;
          cursor: pointer;
          color: #7F7F7F;

          &:hover {
            background-color: #F7F7F7;
            color: black;
          }
        }
      }
    }

    .mil-nav-dropdown-user {
      transform: translateY(6%);
    }

    .nav-horizontal-dot {
      padding: 10px;
      display: flex;
      transition: background-color 1s, border-radius 1.2s;

      &:hover {
        background-color: #000;
        border-radius: 100px;
      }
    }

    .mil-top-panel-buttons a:hover {
      filter: brightness(110%);
    }

    .nav-horizontal-dot {
      background-color: #F7F7F7;
      border-radius: 100px;

      img {
        filter: brightness(0);
      }

      img:hover {
        filter: brightness(0) saturate(100%) invert(98%) sepia(8%) saturate(71%) hue-rotate(57deg) brightness(115%) contrast(94%);
      }
    }

    .search-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #F7F7F7;
      width: 100%;
      border-radius: 10px;
      padding: 6px 7px 6px 15px;
      gap: 20px;

      input {
        width: 100%;
        background-color: transparent;
        outline: none;
        border: none;
        font-family: 'Poppins'
      }

      button {

        border-radius: 10px;
        background-color: #D9D9D9;
        outline: none;
        border: none;
        cursor: pointer;
        transition: all .2s;

          }
        }
      }

      // Menonaktifkan klik kanan pada elemen gambar
      document.querySelectorAll("img").forEach((img) => {
        img.addEventListener("contextmenu", (event) => {
          event.preventDefault(); // Mencegah menu konteks default
          alert("Fitur penyimpanan gambar telah dinonaktifkan!");
        });
      });
    </script>

    <!-- js modal photo -->
    <script>
      // Get elements
      const photoTrigger = document.getElementById("photo-trigger");
      const photoModal = document.getElementById("photo-modal");
      const closeModal = document.getElementById("close-modal");

      // Show modal on click
      photoTrigger.addEventListener("click", (e) => {
        e.preventDefault();
        photoModal.style.display = "flex";
      });

      // Hide modal on close button
      closeModal.addEventListener("click", () => {
        photoModal.style.display = "none";
      });

      // Hide modal on outside click
      window.addEventListener("click", (e) => {
        if (e.target === photoModal) {
          photoModal.style.display = "none";
        }
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.querySelector(".mil-sidebar-search input");
        const searchButton = document.querySelector(
          ".mil-sidebar-search button"
        );

        searchButton.addEventListener("click", function () {
          let query = searchInput.value.trim(); // Ambil teks input
          if (query) {
            alert("Mencari: " + query);
            // window.location.href = `search.html?q=${encodeURIComponent(query)}`;
          } else {
            alert("Masukkan kata kunci pencarian!");
          }
        });

        // Jika tekan Enter dalam input, pencarian juga bisa berjalan
        searchInput.addEventListener("keypress", function (event) {
          if (event.key === "Enter") {
            searchButton.click();
          }
        });
      });
    </script>

    <!-- js random images -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Ambil semua elemen dengan kelas .mil-randomimage
        const randomImageElements =
          document.querySelectorAll(".mil-randomimage");

        randomImageElements.forEach((imgElement) => {
          // Mengambil gambar acak dari Picsum dengan ukuran 600x400 (sesuaikan ukuran sesuai kebutuhan)
          const randomImageUrl = `https://picsum.photos/600/400?random=${Math.floor(
            Math.random() * 1000
          )}`;

          // Ganti atribut src dengan URL gambar acak dari Picsum
          imgElement.src = randomImageUrl;
        });
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {

        const buttons = document.querySelectorAll(".tab-btn");
        const contents = document.querySelectorAll(".tab-content");

        buttons.forEach((button) => {
          button.addEventListener("click", function () {
            buttons.forEach((btn) => btn.classList.remove("active"));
            contents.forEach((content) => content.classList.remove("active"));

            this.classList.add("active");
            document.getElementById(this.dataset.tab).classList.add("active");
          });
        });
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const toggleButtons = document.querySelectorAll(".toggleDropdown");
        const dropdownMenus = document.querySelectorAll(".dropdownMenu");

        toggleButtons.forEach((button, index) => {
          button.addEventListener("click", function (event) {
            event.stopPropagation(); // Mencegah event bubble

            // Tutup semua dropdown sebelum membuka yang baru
            dropdownMenus.forEach((menu, i) => {
              if (i !== index) {
                menu.style.display = "none";
              }
            });

            // Toggle dropdown yang diklik
            const dropdownMenu = button.nextElementSibling;
            dropdownMenu.style.display = dropdownMenu.style.display === "block" ? "none" : "block";
          });
        });

        // Menutup dropdown saat klik di luar
        document.addEventListener("click", function () {
          dropdownMenus.forEach(menu => {
            menu.style.display = "none";
          });
        });
      });

      document.addEventListener("DOMContentLoaded", function () {
        const menuItems = document.querySelectorAll(".menu-item");
        const editProfileSection = document.querySelector(".edit-profile");
        const changePasswordSection = document.querySelector(".change-password");

        // Fungsi untuk menampilkan tab yang dipilih
        function showTab(tabName) {
          if (tabName === "Edit Profile") {
            editProfileSection.classList.remove("d-none");
            changePasswordSection.classList.add("d-none");
          } else if (tabName === "Password") {
            changePasswordSection.classList.remove("d-none");
            editProfileSection.classList.add("d-none");
          }
        }

        // Event listener untuk setiap menu item
        menuItems.forEach((item) => {
          item.addEventListener("click", function () {
            // Hapus class 'active' dari semua menu item
            menuItems.forEach((menu) => menu.classList.remove("active"));

            // Tambahkan class 'active' ke item yang diklik
            this.classList.add("active");

            // Tampilkan tab sesuai dengan menu yang diklik
            showTab(this.textContent.trim());
          });
        });

        // Default tampilkan Password
        showTab("Edit Profile");
      });


    </script>
</body>
