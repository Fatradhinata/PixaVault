  <style>
    body {
      font-family: 'Poppins';
    }


    .sidenav {
      border-right: 1px solid #D9D9D9 !important;
      border-radius: 0px !important;
    }

    .report-card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      /* Agar bisa mengecil */
      max-width: 510px;
      /* Batas maksimum */
      min-width: 510px;
      /* Supaya tidak terlalu kecil */
      height: auto;
    }

    /* Tambahkan media query untuk layar kecil */
    @media (max-width: 600px) {
      .report-card {
        max-width: 510px;
        /* Batas maksimum */
        min-width: 280px;
        /* Supaya tidak terlalu kecil */
        padding: 15px;
      }
    }

    .report-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 20px;
      padding-bottom: 22px;
      border-bottom: 2px solid #eee;
      /* Garis bawah */
    }

    .chart-container {
      position: relative;
      width: 250px;
      height: 250px;
      margin: auto;
    }

    .report-average {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      font-weight: 700;
      color: #222;
    }

    .report-legend {
      text-align: left;
      padding-top: 25px;
      padding-left: 50px;
      padding-right: 50px;

    }

    .report-legend-item {
      display: flex;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      color: #555;
      margin: 6px 0;
      padding: 10px;
      justify-content: space-between;
      /* Meletakkan teks di kiri dan angka di kanan */
    }

    .report-legend-color {
      width: 12px;
      height: 12px;
      display: inline-block;
      margin-right: 10px;
      border-radius: 50%;
    }

    .report-label {
      display: flex;
      align-items: center;
      gap: 10px;
      /* Beri jarak antara warna dan teks */
    }

    .report-value {
      font-weight: 300;
      /* Bisa diatur lebih tegas */
      color: #7F7F7F;
    }

    .report-approved {
      background: #b0ff27;
    }

    .report-pending {
      background: #ccc;
    }

    .report-review {
      background: #666;
    }

    .report-rejected {
      background: black;
    }

    .card-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: auto;


    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
      padding-bottom: 22px;
      border-bottom: 2px solid #eee;
      /* Garis bawah */
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 250px;
      margin: auto;
    }


    .chart-joined {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: auto;
    }

    .chart-title,
    .chart-subtitle {
      margin: 5px 0;
      color: #333;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }



    .show-entries {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #666;
    }

    #entries {
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: white;
    }

    .pagination {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .page-numbers {
      display: flex;
      gap: 4px;
    }

    .page-btn {
      padding: 8px 16px;
      border: none;

      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.2s;
    }

    .action-create {
      padding: 6px;
      background-color: #BCFF00;
      border-radius: 8px;
      cursor: pointer;
      margin-left: 24px;

      &:hover {
        filter: brightness(.9);
      }
    }

    .page-btn:hover {
      background-color: #e0e0e0;
    }

    .page-btn:disabled {
      background-color: #f0f0f0;
      ;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .page-number {
      padding: 8px 16px;
      border: none;
      background-color: #ffff;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .page-number:hover {
      background-color: #e0e0e0;
    }

    .page-number.active {
      background-color: #000;
      color: white;
    }

    .dots {
      padding: 8px 16px;
      user-select: none;
      transition: color 0.2s;
      border-radius: 8px;
      background-color: white;
    }

    .dots:hover {
      background-color: #e0e0e0;
    }
    
    .form-wrapper {
      display: flex;
      flex-direction: column;
      gap: 40px;

      h4 {
        font-size: 32px;
        font-weight: 700;
      }
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 50px;

      .input-wrapper {
        display: flex;
        flex-direction: column;
        gap: 25px;

        .column-input {
          display: flex;
          gap: 36px;
        }
          .input-group {
            display: flex;
            flex-direction: column;
            gap: 14px;

            input,
            select {
              border-radius: 8px !important;
              padding: 13px;
              padding-left: 18px;
              border: 1px solid #7F7F7F
            }

            p {
              margin: 0;
            }
          }

          
        }
        .btn-create {
          button {
            border: none;
            background-color: #000;
            font-size: 16px;
            color: white;
            padding: 13px 60px;
            border-radius: 8px;
            cursor: pointer;

            &:hover {
              filter: brightness(0.9);
            }
          }
        }
    }
  </style>
</head>

  <!-- js pagination -->
  <script>
    const pageNumbers = document.getElementById('page-numbers');
    const prevButton = document.getElementById('prev');
    const nextButton = document.getElementById('next');
    const searchInput = document.getElementById('search');
    const entriesSelect = document.getElementById('entries');
    const totalEntriesSpan = document.getElementById('total-entries');

    let currentPage = 1;
    let totalPages = 10;
    let entriesPerPage = parseInt(entriesSelect.value);

    function createPagination() {
      const pages = [];

      // Always show first page + ellipsis + last page
      if (currentPage <= 3) {
        // Show 1, 2, 3, ..., totalPages
        for (let i = 1; i <= Math.min(3, totalPages); i++) {
          pages.push(i);
        }
        if (totalPages > 3) {
          pages.push('...');
          pages.push(totalPages);
        }
      } else if (currentPage >= totalPages - 2) {
        // Show 1, ..., totalPages-2, totalPages-1, totalPages
        pages.push(1);
        pages.push('...');
        for (let i = Math.max(totalPages - 2, 2); i <= totalPages; i++) {
          pages.push(i);
        }
      } else {
        // Show 1, ..., currentPage-1, currentPage, currentPage+1, ..., totalPages
        pages.push(1);
        pages.push('...');
        pages.push(currentPage - 1);
        pages.push(currentPage);
        pages.push(currentPage + 1);
        pages.push('...');
        pages.push(totalPages);
      }

      // Clear existing page numbers
      pageNumbers.innerHTML = '';

      // Create page number elements
      pages.forEach((page, index) => {
        if (page === '...') {
          const dots = document.createElement('span');
          dots.className = 'dots';
          dots.textContent = '...';

          // Determine if it's the first or second set of dots
          const isFirstDots = pages[index - 1] < currentPage;

          dots.addEventListener('click', () => {
            if (isFirstDots) {
              // Jump backward by 3 pages, but not before page 1
              currentPage = Math.max(1, currentPage - 3);
            } else {
              // Jump forward by 3 pages, but not after last page
              currentPage = Math.min(totalPages, currentPage + 3);
            }
            updatePagination();
          });

          pageNumbers.appendChild(dots);
        } else {
          const button = document.createElement('button');
          button.className = `page-number ${currentPage === page ? 'active' : ''}`;
          button.textContent = page;
          button.addEventListener('click', () => {
            if (page !== currentPage) {
              currentPage = page;
              updatePagination();
            }
          });
          pageNumbers.appendChild(button);
        }
      });

      // Update prev/next button states
      prevButton.disabled = currentPage === 1;
      nextButton.disabled = currentPage === totalPages;
    }

    function updatePagination() {
      createPagination();
      // Here you would typically fetch data for the new page
      console.log(`Current page: ${currentPage}, Showing ${entriesPerPage} entries`);
    }

    // Add event listeners for prev/next buttons
    prevButton.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        updatePagination();
      }
    });

    nextButton.addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage++;
        updatePagination();
      }
    });

    // Add event listener for entries select
    entriesSelect.addEventListener('change', (e) => {
      entriesPerPage = parseInt(e.target.value);
      totalPages = Math.ceil(parseInt(totalEntriesSpan.textContent) / entriesPerPage);
      currentPage = 1; // Reset to first page when changing entries per page
      updatePagination();
    });

    // Add event listener for search input
    searchInput.addEventListener('input', (e) => {
      // Here you would typically implement search functionality
      console.log('Search query:', e.target.value);
    });

    // Initial pagination setup
    createPagination();
  </script>
