<!DOCTYPE html>
<html lang="en-US">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <!-- bootstrap grid css -->
  <link rel="stylesheet" href="css/plugins/bootstrap-grid.css">
  <!-- font awesome css -->
  <link rel="stylesheet" href="css/plugins/font-awesome.min.css">
  <!-- swiper css -->
  <link rel="stylesheet" href="css/plugins/swiper.min.css">
  <!-- magnific css -->
  <link rel="stylesheet" href="css/plugins/magnific-popup.css">
  <!-- ruizarch css -->
  <link rel="stylesheet" href="css/style.css">
  <!-- custom login css -->
  <link rel="stylesheet" href="css/login.css">
  <!-- page name -->
  <title>Pixel Vault</title>

</head>

<body>
  <div class="wrapper login-wrapper">
    <div class="left-content d-flex">
      <h1>Register Now</h1>
      <p class="content-subheading">Create an account to discover high-quality photos, share your own work, and connect with talented photographers around the globe.</p>
      <div class="login-input d-flex">
        <div class="input-group">
          <input type="text" placeholder="Username" autocomplete="email">
        </div>
        <div class="input-group">
          <input type="text" placeholder="Email" autocomplete="email">
        </div>
        <div class="input-group">
          <input type="password" placeholder="Password" autocomplete="off">
          <img src="img/icons/eye-close.svg" alt="password icon" width="28px">
        </div>
      </div>
      <button class="btn btn-login">Register</button>
      <div class="continue-text-bar">
        <div></div>
        <p>or continue with</p>
        <div></div>
      </div>
      <button class="btn-outline btn-google d-flex">
        <img src="img/icons/google.svg" alt="google">
        <p>Log In with Google</p>
      </button>
      <p class="register-text text-dark-gray">don’t have an account? <span>Register now</span></p>
    </div>
    <div class="right-content">
      <img src="img/illustration/Login-amico (1) 1.png" alt="login illustration">
    </div>
  </div>
  <!-- jQuery js -->
  <script src="js/plugins/jquery.min.js"></script>
  <!-- swiper js -->
  <script src="js/plugins/swiper.min.js"></script>
  <!-- gsap js -->
  <script src="js/plugins/gsap.min.js"></script>
  <!-- imagesloaded js -->
  <script src="js/plugins/imagesloaded.pkgd.js"></script>
  <!-- isotope js -->
  <script src="js/plugins/isotope.min.js"></script>
  <!-- scroll smoother -->
  <script src="js/plugins/smooth-scroll.js"></script>
  <!-- scroll trigger js -->
  <script src="js/plugins/ScrollTrigger.min.js"></script>
  <!-- magnific js -->
  <script src="js/plugins/magnific-popup.js"></script>
  <!-- ruizarch js -->
  <script src="js/main.js"></script>

</body>

</html>
