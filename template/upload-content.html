        *,

        body,

        #content {
            display: flex;
            justify-content: center;
            align-items: center;

        .upload-content {
            display: flex;
            flex-direction: column;
            gap: 34px;

            width: 991px;
            min-height: 70%;
            height: fit-content;

            overflow: hidden;

                border: 1px solid #D9D9D9;
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .header h5 {
            font-size: 28px;
        }

        .core {
            display: flex;
            gap: 55px;
            flex: 1;
        }

        .upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            text-align: center;
            width: 47%;
        }

        .upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 17px;
            background-color: #FDFDFD;
            cursor: pointer;

            height: 100%;
            width: 100%;

            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 20px 60px;

            overflow: hidden;

            p {
                line-height: 20px;
                color: black;
                font-weight: 500;

                span {
                    cursor: pointer;
                    color: #0065B8;
                    text-decoration: underline;

                    &:hover {
                        filter: brightness(0.8);
                    }
                }
            }
        }

        .uploaded {
            padding: 0;
            max-height: 300px;
            border: 2px solid #ccc;

            img {
                object-fit: contain !important;
            }
        }

        .file-detail-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 3px 10px;
            border-radius: 8px;
            background: transparent;
            border: 2px solid #D9D9D9;
        }

        .file-detail {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filename {
            max-width: 250px;            
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            display: inline-block;            
            vertical-align: middle;
        }

        .filename-wrapper {
            text-align: left;
            max-width: 100%;            
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            display: block;


            .file-size {
                color: #7F7F7F;
            }
        }

        .filename-wrapper p {
            font-size: 14px;
            line-height: 20px;
            font-weight: 500;
        }

        .upload-detail {
            width: 53%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;

            p {
                font-size: 16px;
                font-weight: 600;
            }
        }

        .input-wrapper-row {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #D9D9D9;
            border-radius: 5px;
            font-size: 14px;
            color: black;
            font-weight: 600;
        }

        .upload-submit-wrapper {
            display: flex;
            gap: 10px;

            button {
                border-radius: 8px;
                cursor: pointer;
                padding: 8px 30px;
                font-size: 18px;
                transition: background-color 0.3s
            }
        }

        .trash-icon {
            cursor: pointer;
            transition: all .3s;
            &:hover {
                filter: brightness(0) saturate(100%) invert(13%) sepia(92%) saturate(5556%) hue-rotate(2deg) brightness(105%) contrast(123%);
            }
        }

        .upload-button {
            background-color: #BCFF00;
            color: black;
            font-weight: 600;
            border: none;
            cursor: pointer;

            &:hover {
                background-color: #CFFF00;
            }
        }

        .upload-cancel-button {
            background-color: transparent;
            color: black;
            border: none;
            font-weight: 600;

            &:hover {
                background-color: #D9D9D9;
            }
        }

        /* ---------- Responsive Styles ---------- */

/* For large devices (max-width: 1200px) */
@media (max-width: 1200px) {

    .upload {

    }
    .upload-detail {
        width: 50%;
    }
}

/* For medium devices (max-width: 992px) */
@media (max-width: 992px) {
    #content {
        height: auto;
        padding: 20px;
    }
    .upload-content {
        padding: 20px 30px;
    }
    .core {
        flex-direction: column;
        gap: 20px;
    }
    .upload, 
    .upload-detail {
        width: 100%;
    }
}

/* For small devices (max-width: 768px) */
@media (max-width: 768px) {
    .upload-content {
        padding: 20px 20px;
    }
    .header h5 {
        font-size: 24px;
    }
    input {
        font-size: 13px;
    }
    .upload-submit-wrapper button {
        font-size: 16px;
        padding: 6px 20px;
    }
}

/* For extra small devices (max-width: 576px) */
@media (max-width: 576px) {
    .upload-content {
        padding: 15px 10px;
        width: 100%;
    }
    .header h5 {
        font-size: 20px;
    }
    .core {
        gap: 15px;
    }
    input {
        font-size: 12px;
    }
    .upload-submit-wrapper button {
        font-size: 14px;
        padding: 6px 15px;
    }
    .filename {
        max-width: 150px;
    }
    .input-wrapper-row {
        display: flex;
        flex-direction: column;
    }
}

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const uploadArea = document.querySelector(".upload-area");
            const fileInput = document.createElement("input");
            fileInput.type = "file";
            fileInput.accept = "image/*";
            fileInput.style.display = "none";

            const fileDetailWrapper = document.querySelector(".file-detail-wrapper");
            const fileNameElement = document.querySelector(".filename");
            const fileSizeElement = document.querySelector(".file-size");

            uploadArea.addEventListener("click", () => fileInput.click());

            fileInput.addEventListener("change", (event) => {
                handleFile(event.target.files[0]);
            });

            uploadArea.addEventListener("dragover", (event) => {
                event.preventDefault();
                uploadArea.classList.add("drag-over");
            });

            uploadArea.addEventListener("dragleave", () => {
                uploadArea.classList.remove("drag-over");
            });

            uploadArea.addEventListener("drop", (event) => {
                event.preventDefault();
                uploadArea.classList.remove("drag-over");
                if (event.dataTransfer.files.length > 0) {
                    handleFile(event.dataTransfer.files[0]);
                }
            });

            function handleFile(file) {
                if (file && file.type.startsWith("image/")) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        uploadArea.innerHTML = `<img src="${e.target.result}" alt="uploaded-image" style="max-width: -webkit-fill-available; max-height: inherit; object-fit: contain; border-radius: 8px;">`;

                        uploadArea.classList.add("uploaded");

                        // **Update filename & file size**
                        fileNameElement.textContent = file.name;

                        // **Filter size (KB atau MB)**
                        let fileSize = file.size / 1024; // Convert to KB
                        if (fileSize < 1024) {
                            fileSizeElement.textContent = fileSize.toFixed(2) + " KB";
                        } else {
                            fileSizeElement.textContent = (fileSize / 1024).toFixed(2) + " MB";
                        }

                        // **Unhide file details**
                        fileDetailWrapper.style.display = "flex";
                    };
                    reader.readAsDataURL(file);
                } else {
                    alert("Please upload a valid image file.");
                }
            }

            document.body.appendChild(fileInput);
        });

    </script>
